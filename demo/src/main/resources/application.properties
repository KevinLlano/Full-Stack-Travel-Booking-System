# ===== Database Configuration =====
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:full_stack_ecommerce}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.rest.base-path=/api
spring.jackson.parser.allow-comments=true

logging.level.org.springframework=INFO
logging.level.com.assessment.demo=INFO


server.address=0.0.0.0

# AWS SQS Configuration (OPTIONAL)
aws.sqs.enabled=false
aws.sqs.queue.url=

# Redis Configuration (Local)
spring.redis.enabled=true
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ===== Spring AI Configuration =====
# OpenAI API Key (loaded from .env file via spring-dotenv)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# PGVector Store Configuration (uses existing PostgreSQL connection)
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# AI Feature Toggle (set to false to disable AI features)
app.ai.enabled=true